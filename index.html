<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4efe4">
<title>Планировщик</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe4;--sf:#fbf8f1;--bd:#ddd3bf;--ln:#cfc4ac;--tx:#2a2622;--mu:#7a7165;--rd:#b3262d;--on:#fbf8f1;--tb:#ece5d4;--cw:#2f5577;--cwb:#8aa6bf;--cm:#2c6b6b;--cmb:#8fb8b8;--cs:#3d6a42;--csb:#9ab99d;--cf:#8a6a1f;--cfb:#cbb176;--cd:#a3202a;--cdb:#d49a9d}
:root.dk{--bg:#121110;--sf:#1b1a18;--bd:#34322f;--ln:#3a3836;--tx:#ece6d9;--mu:#8a8379;--rd:#c1272d;--on:#f3ece0;--tb:#0d0c0b;--cw:#7fa0c0;--cwb:#4a6580;--cm:#6fb3b3;--cmb:#3f7070;--cs:#8fb593;--csb:#4f6e53;--cf:#d1b074;--cfb:#7a6636;--cd:#e0575c;--cdb:#8a2a2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{margin:0;position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
input,textarea{-webkit-user-select:text;user-select:text}
#app{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pg{max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 24px}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;font-size:16px;background:var(--sf);border:1px solid var(--bd);border-radius:3px;padding:10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--rd)}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px}
.hd{display:flex;align-items:center;gap:12px}
.seal{width:34px;height:34px;background:var(--rd);color:var(--on);font-size:19px;display:flex;align-items:center;justify-content:center;transform:rotate(-4deg);border-radius:3px;font-family:'Noto Serif',serif;flex:none}
h1{font-family:'Noto Serif',Georgia,serif;font-size:24px;font-weight:500;margin:0}
.su{font-size:13px;color:var(--mu);margin:4px 0 14px 46px}
.ln{height:1px;background:var(--ln);margin:0 0 14px;position:relative}
.ln:after{content:"";position:absolute;left:0;top:-1px;width:44px;height:3px;background:var(--rd)}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:3px;padding:12px 14px;margin-bottom:10px}
.lb{font-size:12px;color:var(--mu);margin:0}
.nm{font-family:'Noto Serif',Georgia,serif;font-size:21px;font-weight:500;margin:3px 0 0}
.rh{font-size:12px;color:var(--cd);letter-spacing:.06em;margin:16px 0 2px;text-transform:uppercase}
.tk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--bd)}
.tk.f1{border-top:none}
.tbd{flex:1;min-width:0;cursor:pointer}
.tt{font-size:15px;margin:0;line-height:1.35;word-break:break-word}
.tt.dn{text-decoration:line-through;color:var(--mu)}
.mt{font-size:12px;color:var(--mu);margin:5px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pl{font-size:11px;padding:1px 8px;border:1px solid;border-radius:2px;white-space:nowrap}
.pw{color:var(--cw);border-color:var(--cwb)}.pm{color:var(--cm);border-color:var(--cmb)}.ps{color:var(--cs);border-color:var(--csb)}.pf{color:var(--cf);border-color:var(--cfb)}.pd{color:var(--cd);border-color:var(--cdb)}.pn{color:var(--mu);border-color:var(--bd)}
.btn{background:var(--rd);color:var(--on);border:none;height:46px;border-radius:2px;font-size:15px;font-family:'Noto Serif',serif;letter-spacing:.04em;padding:0 16px;cursor:pointer}
.btn2{background:transparent;color:var(--tx);border:1px solid var(--mu);height:46px;border-radius:2px;padding:0 14px;cursor:pointer}
.btn.w,.btn2.w{width:100%}
.btn.s,.btn2.s{height:34px;font-size:13px;padding:0 10px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row>.fx{flex:none}
.tabs{flex:none;position:relative;background:var(--tb);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs>div{display:flex;width:100%;max-width:520px}
.tabs button{flex:1;border:none;background:transparent;font-size:10px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 8px;cursor:pointer}
.tabs button b{font-family:'Noto Serif',serif;font-weight:400;font-size:20px;line-height:1.2}
.tabs button.on{color:var(--cd)}
.sg{display:flex;border:1px solid var(--bd);border-radius:3px;margin-bottom:12px}
.sg button{flex:1;border:none;background:transparent;font-size:12px;padding:9px 2px;color:var(--mu);cursor:pointer}
.sg button.on{background:var(--rd);color:var(--on)}
.sg.wrap{flex-wrap:wrap}.sg.wrap button{flex:1 0 30%}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.bw{display:flex;align-items:flex-end;gap:10px;height:130px;margin:10px 0 26px;position:relative;border-bottom:1px solid var(--ln)}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative}
.bp{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.bp i{display:block;width:44%;max-width:18px}
.bc span{font-size:11px;color:var(--mu);position:absolute;bottom:-19px}
.gl{position:absolute;left:0;right:0;top:0;border-top:1px dashed var(--rd)}
.gl span{position:absolute;right:0;top:-16px;font-size:10px;color:var(--cd);bottom:auto}
.ex{display:flex;justify-content:space-between;font-size:13px;margin-top:12px;gap:8px}
.br{height:4px;background:var(--bd);margin-top:5px}
.br i{display:block;height:100%;background:var(--rd)}
.ai{border:1px solid var(--cfb);border-left:3px solid var(--cf);background:var(--sf);padding:11px 14px;font-size:13px;line-height:1.5;margin:10px 0}
.ai b{font-weight:500;display:block;margin-bottom:2px;color:var(--cf);font-size:12px;letter-spacing:.04em}
.mic{width:76px;height:76px;border-radius:50%;background:var(--rd);color:var(--on);border:3px double var(--on);font-size:28px;display:flex;align-items:center;justify-content:center;margin:6px auto;cursor:pointer;font-family:'Noto Serif',serif}
.mic.rec{animation:pl 1s infinite}
@keyframes pl{50%{opacity:.55}}
.mx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.q{background:var(--sf);border:1px solid var(--bd);padding:10px;min-height:150px;border-radius:3px}
.q h4{font-family:'Noto Serif',serif;font-weight:500;font-size:14px;margin:0}
.q .k{font-size:11px;color:var(--mu);margin:2px 0 8px}
.q .i{font-size:12px;line-height:1.35;padding:6px 0;border-top:1px solid var(--bd);cursor:pointer}
.q.a{border-top:3px solid var(--rd)}.q.b{border-top:3px solid var(--cw)}.q.c{border-top:3px solid var(--cf)}.q.d{border-top:3px solid var(--mu)}
.dots{display:flex;gap:4px;margin-top:6px}.dots i{width:14px;height:6px;background:var(--bd);display:block}.dots i.o{background:var(--rd)}
.eq{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-top:1px solid var(--bd)}
.cm{display:flex;gap:6px;margin-top:8px}
.cm button{flex:1;height:36px;font-size:12px;border:1px solid var(--bd);background:transparent;color:var(--mu);border-radius:2px;cursor:pointer}
.cm button.on{background:var(--rd);border-color:var(--rd);color:var(--on)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet>div{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-top:3px solid var(--rd)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:3px;font-size:13px;z-index:20;display:none;max-width:90%}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0}
.chk input{width:auto}
.days{display:flex;gap:4px}
.days label{flex:1;margin:0;text-align:center}
.days input{display:none}
.days span{display:block;padding:8px 0;border:1px solid var(--bd);font-size:12px;color:var(--mu);cursor:pointer}
.days input:checked+span{background:var(--rd);color:var(--on);border-color:var(--rd)}
.qa{display:flex;gap:8px;margin-bottom:6px}
.qa button{width:46px;flex:none;padding:0}
small{color:var(--mu)}
a{color:var(--cd)}
.ck{width:26px;height:26px;border:1.5px solid var(--mu);border-radius:50%;background:transparent;flex:none;padding:0;position:relative;color:var(--on);cursor:pointer;font-family:'Noto Serif',serif;font-size:15px}
.ck.dn{background:var(--rd);border-color:var(--rd);border-radius:5px;transform:rotate(-6deg)}
.ck.dn:after{content:"済";position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.swp{position:relative;margin-bottom:8px;border-radius:10px;overflow:hidden}
.swp .hl,.swp .hr{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:13px;color:var(--on);padding:0 16px;width:50%}
.swp .hl{left:0;background:var(--cs)}
.swp .hr{right:0;justify-content:flex-end;background:var(--cf)}
.card{position:relative;display:flex;align-items:stretch;background:var(--sf);box-shadow:0 0 0 1px var(--bd) inset;border-radius:10px;touch-action:pan-y}
.card>i{width:5px;flex:none}
.card .cb{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:11px 12px}
.card.dn .cb,.card.dn>i{opacity:.55}
.card .mt{margin-top:4px;gap:6px;font-size:12px}
.mt b{font-weight:400;color:var(--ln)}
.hot{color:var(--cd)}
.sec{margin:16px 0 6px}
.sh{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.sh span{font-family:'Noto Serif',Georgia,serif;font-size:19px}
.sh i{flex:1;height:1px;background:var(--ln)}
.sh small{font-size:12px;color:var(--mu)}
.sec.today .sh span{font-size:23px;display:flex;align-items:center}
.sec.today .sh span:before{content:"今";display:inline-block;background:var(--rd);color:var(--on);width:26px;height:26px;line-height:26px;text-align:center;font-size:15px;margin-right:9px;transform:rotate(-4deg);border-radius:3px}
.sec.over .sh span,.sec.over .sh small{color:var(--cd)}
.sec.over .sh i{background:var(--cdb)}
.sec.soon .sh span{color:var(--mu);font-size:17px}
.sec.soon .card{background:var(--bg);box-shadow:none;border:1px dashed var(--ln)}
.sec.soon .card .tt{color:var(--mu)}
.sec.soon .ck{border-color:var(--bd)}
.dh{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-family:'Noto Serif',serif;font-size:15px;color:var(--mu)}
.dh:after{content:"";flex:1;height:1px;background:var(--bd)}
.sh+.dh{margin-top:0}
.dhd{display:flex;justify-content:space-between;align-items:flex-end;padding-top:6px}
.dwd{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.dfull{font-family:'Noto Serif',Georgia,serif;font-size:34px;line-height:1.05}
.dcnt{text-align:right}
.dcnt span{font-family:'Noto Serif',serif;font-size:28px;color:var(--rd)}
.dcnt small{font-size:16px;color:var(--mu)}
.pbar{height:4px;background:var(--bd);border-radius:2px;margin:8px 0 14px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--rd)}
.empty{text-align:center;padding:30px 12px}
.empty .seal{margin:0 auto 12px;width:46px;height:46px;font-size:25px}
.empty .t2{font-family:'Noto Serif',serif;font-size:19px;margin:0}
</style>
</head>
<body>
<div id="app"></div>
<div class="tabs"><div id="tabs"></div></div>
<div id="sheet"><div id="sheetc"></div></div>
<div id="toast"></div>
<script src="xlsx.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var today=function(){return ymd(new Date())};
var D0=function(s){return new Date(s+'T00:00:00')};
var addDays=function(s,n){var d=D0(s);d.setDate(d.getDate()+n);return ymd(d)};
var diffDays=function(a,b){return Math.round((D0(a)-D0(b))/864e5)};
var fmt=function(x){return Math.round(x).toLocaleString('ru-RU')};
var rub=function(x){return (x<0?'−':'')+fmt(Math.abs(x))+' ₽'};
var MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
var MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MS=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
var WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
var WDS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
function dlabel(s){if(!s)return '';var d=diffDays(s,today());if(d===0)return 'сегодня';if(d===1)return 'завтра';if(d===-1)return 'вчера';var x=D0(s);return x.getDate()+' '+MS[x.getMonth()].toLowerCase()}

var SP={pr:['Проектная','pw'],mo:['Монтажная','pm'],sport:['Спорт','ps'],family:['Семья','pf'],other:['Другое','pn']};
var QN={a:['Сделать сейчас','срочно и важно'],b:['Запланировать','важно, не срочно'],c:['Поручить','срочно, не важно'],d:['Отложить','не срочно, не важно']};

var DEF=function(){return {v:1,tasks:[],rec:[],ops:[],rules:[],subs:[],set:{upd:0,theme:'lt',goal:2000000,share:0.5,syncMoney:false,tz:'',morning:'08:00',lead:10,vapidPub:'',
 orgs:{pr:{name:'Проектная',alias:''},mo:{name:'Монтажная',alias:''}},
 team:'ГИП, Проектировщик, Руководитель продаж, Операционный менеджер, Инженер ТО, Бухгалтер',
 tgt:{work:45,sport:8,family:15},to:{cur:0,tgt:30},
 cats:{pr:'Зарплаты, Субподряд, Налоги и взносы, Аренда и офис, ПО и связь, Прочее',mo:'Материалы и оборудование, Зарплаты, Налоги и взносы, Транспорт и инструмент, Субподряд, Прочее'}}}};

var S,SEC,UI={view:'today',more:'money',mx:'q',dir:'all',mm:today().slice(0,7),me:'my',prop:[],inbox:'',busy:''};
function load(){
 var d;try{d=JSON.parse(localStorage.getItem('plan.data')||'null')}catch(e){d=null}
 S=Object.assign(DEF(),d||{});var def=DEF().set;S.set=Object.assign({},def,S.set||{});
 S.set.orgs=Object.assign({},def.orgs,S.set.orgs||{});S.set.tgt=Object.assign({},def.tgt,S.set.tgt||{});S.set.to=Object.assign({},def.to,S.set.to||{});S.set.cats=Object.assign({},def.cats,S.set.cats||{});
 S.subs=S.subs||[];if(!S.set.tz){try{S.set.tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}}
 try{SEC=JSON.parse(localStorage.getItem('plan.sec')||'null')}catch(e){SEC=null}
 SEC=Object.assign({key:'',model:'claude-sonnet-5-5',gh:'',repo:'',path:'data.json'},SEC||{});
}
var pushT=null;
function save(){try{localStorage.setItem('plan.data',JSON.stringify(S))}catch(e){toast('Не удалось сохранить: память браузера переполнена')}
 clearTimeout(pushT);if(SEC.gh&&SEC.repo)pushT=setTimeout(function(){sync(true)},3000)}
function saveSec(){localStorage.setItem('plan.sec',JSON.stringify(SEC))}
function touch(o){o.upd=Date.now();return o}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},3200)}
function applyTheme(){document.documentElement.className=S.set.theme==='dk'?'dk':'';var m=document.querySelector('meta[name=theme-color]');if(m)m.content=S.set.theme==='dk'?'#121110':'#f4efe4'}

/* ---------- sync via GitHub ---------- */
function mergeList(a,b){var m={};(a||[]).concat(b||[]).forEach(function(x){var o=m[x.id];if(!o||(x.upd||0)>(o.upd||0))m[x.id]=x});return Object.keys(m).map(function(k){return m[k]})}
function mergeState(l,r){var o=Object.assign({},l);
 o.tasks=mergeList(l.tasks,r.tasks);o.rec=mergeList(l.rec,r.rec);o.subs=mergeList(l.subs,r.subs);
 if(l.set.syncMoney||(r.set&&r.set.syncMoney)){o.ops=mergeList(l.ops,r.ops);o.rules=mergeList(l.rules,r.rules)}
 if(r.set&&(r.set.upd||0)>(l.set.upd||0)){var keepMoney=l.set.syncMoney;o.set=Object.assign({},l.set,r.set);if(keepMoney)o.set.syncMoney=true}
 return o}
function outData(){var o={v:1,tasks:S.tasks,rec:S.rec,subs:S.subs,set:S.set};if(S.set.syncMoney){o.ops=S.ops;o.rules=S.rules}return o}
function b64enc(s){return btoa(unescape(encodeURIComponent(s)))}
function b64dec(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}
async function ghReq(method,body){
 var r=await fetch('https://api.github.com/repos/'+SEC.repo+'/contents/'+SEC.path,{method:method,headers:{Authorization:'Bearer '+SEC.gh,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 return r}
async function sync(silent){
 if(!SEC.gh||!SEC.repo){if(!silent)toast('Укажите токен и репозиторий в настройках');return}
 try{
  UI.busy='sync';var r=await ghReq('GET');var sha=null;
  if(r.status===200){var j=await r.json();sha=j.sha;var rem=JSON.parse(b64dec(j.content));S=mergeState(S,rem);localStorage.setItem('plan.data',JSON.stringify(S));applyTheme();render()}
  else if(r.status!==404){throw new Error('GitHub ответил '+r.status+(r.status===401?' (токен не подошёл)':r.status===403?' (нет прав у токена)':''))}
  var body={message:'sync '+new Date().toISOString(),content:b64enc(JSON.stringify(outData(),null,1))};if(sha)body.sha=sha;
  var p=await ghReq('PUT',body);
  if(p.status===409||p.status===422){toast('Данные изменились на другом устройстве, синхронизирую заново');UI.busy='';return sync(silent)}
  if(!p.ok)throw new Error('Запись не удалась: '+p.status);
  SEC.last=Date.now();saveSec();if(!silent)toast('Синхронизировано');
 }catch(e){toast('Синхронизация не удалась: '+e.message)}
 UI.busy='';if(UI.view==='more'&&UI.more==='set')render()}

/* ---------- Claude ---------- */
async function claude(system,content,max){
 if(!SEC.key)throw new Error('Не указан ключ Claude в настройках');
 var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':SEC.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:SEC.model||'claude-sonnet-5-5',max_tokens:max||2000,system:system,messages:[{role:'user',content:content}]})});
 var j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||('Ошибка '+r.status));
 return (j.content||[]).map(function(c){return c.text||''}).join('')}

/* statement parsing */
function pDate(v){if(v==null||v==='')return '';
 if(v instanceof Date){var x=new Date(v.getTime()+12*36e5);return x.getUTCFullYear()+'-'+pad(x.getUTCMonth()+1)+'-'+pad(x.getUTCDate())}
 if(typeof v==='number'){var d=new Date(Math.round((v-25569)*864e5)+12*36e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
 var s=String(v),m=s.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
 m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2})\b/);if(m)return '20'+m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);return ''}
function pNum(v){if(typeof v==='number')return v;if(v==null)return 0;var s=String(v).replace(/[\s ]/g,'').replace('−','-').replace(',','.').replace(/[^0-9.\-]/g,'');var n=parseFloat(s);return isNaN(n)?0:n}
function parseRows(rows){
 var hi=-1,col={};
 for(var i=0;i<Math.min(rows.length,40);i++){var r=rows[i]||[],c={};r.forEach(function(x,j){var s=String(x==null?'':x).toLowerCase();if(!s)return;
   if(/дат/.test(s)&&c.date==null)c.date=j;else if(/дебет|списан|расход/.test(s)&&c.deb==null)c.deb=j;else if(/кредит|зачисл|приход|поступл/.test(s)&&c.cre==null)c.cre=j;else if(/сумма|оборот/.test(s)&&c.amt==null)c.amt=j;else if(/контрагент|плательщик|получатель|наименование/.test(s)&&c.cp==null)c.cp=j;else if(/назначен|описан|коммент|содержан/.test(s)&&c.desc==null)c.desc=j});
  if(c.date!=null&&(c.amt!=null||c.deb!=null||c.cre!=null)){hi=i;col=c;break}}
 if(hi<0)return null;var out=[];
 for(var k=hi+1;k<rows.length;k++){var r2=rows[k]||[];var d=pDate(r2[col.date]);if(!d)continue;
  var a=col.amt!=null&&col.deb==null&&col.cre==null?pNum(r2[col.amt]):(pNum(r2[col.cre])-pNum(r2[col.deb]));if(!a)continue;
  out.push({date:d,amt:a,cp:String(r2[col.cp]==null?'':r2[col.cp]).trim(),desc:String(r2[col.desc]==null?'':r2[col.desc]).trim()})}
 return out}
function b64buf(buf){var b='',u=new Uint8Array(buf),n=0x8000;for(var i=0;i<u.length;i+=n)b+=String.fromCharCode.apply(null,u.subarray(i,i+n));return btoa(b)}
async function readFile(file){
 var name=file.name.toLowerCase(),buf=await file.arrayBuffer();
 if(/\.pdf$/.test(name)){
  var sys='Ты разбираешь банковскую выписку. Верни ТОЛЬКО JSON-массив всех операций: [{"date":"YYYY-MM-DD","amt":число (поступление положительное, списание отрицательное),"cp":"контрагент","desc":"назначение платежа"}]. Ничего не пропускай и не выдумывай.';
  return pickJSON(await claude(sys,[{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64buf(buf)}},{type:'text',text:'Извлеки операции.'}],8000))}
 if(typeof XLSX==='undefined')throw new Error('Не загрузилась библиотека Excel. Проверьте интернет и повторите');
 var wb=XLSX.read(buf,{type:'array',cellDates:true}),all=[],txt='';
 wb.SheetNames.forEach(function(n){var rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});var p=parseRows(rows);if(p)all=all.concat(p);else txt+=rows.slice(0,200).map(function(r){return r.join(' | ')}).join('\n')+'\n'});
 if(all.length)return all;
 if(!SEC.key)throw new Error('Не распознал колонки выписки. Нужны колонки даты и суммы (или дебет и кредит). Добавьте ключ Claude, он разберёт любой формат');
 return pickJSON(await claude('Ты разбираешь банковскую выписку из таблицы. Верни ТОЛЬКО JSON-массив: [{"date":"YYYY-MM-DD","amt":число (поступление положительное, списание отрицательное),"cp":"контрагент","desc":"назначение"}].',txt.slice(0,60000),8000))}
function isInternal(org,o){var other=org==='pr'?'mo':'pr',al=S.set.orgs[other].alias.toLowerCase().split(',').map(function(x){return x.trim()}).filter(Boolean),t=(o.cp+' '+o.desc).toLowerCase();return al.some(function(a){return t.indexOf(a)>=0})}

  var add=[],dup=0;raw.forEach(function(r){var d=pDate(r.date)||r.date;var o={id:uid(),org:org,date:d,amt:+r.amt||0,cp:String(r.cp||'').trim(),desc:String(r.desc||'').trim()};if(!o.amt||!/^\d{4}-\d{2}-\d{2}$/.test(o.date))return;
   var k=org+'|'+o.date+'|'+o.amt+'|'+ruleKey(o.cp)+'|'+o.desc.slice(0,25);if(seen[k]){dup++;return}seen[k]=1;add.push(o)});
  var need=[];
  add.forEach(function(o){if(isInternal(org,o)){o.kind='int';o.cat='Между организациями';return}
   if(o.amt>=0){o.kind='inc';o.cat='Доход';return}
   o.kind='exp';var rl=S.rules.find(function(x){return !x.del&&x.id===ruleKey(o.cp)});if(rl&&ruleKey(o.cp))o.cat=rl.cat;else need.push(o)});
  var cats=catsFor(org);

     res.forEach(function(x){var o=ch[x.i];if(o&&cats.indexOf(x.cat)>=0){o.cat=x.cat;if(o.cp)setRule(o.cp,x.cat)}})}catch(e){toast('Claude не разложил часть расходов: '+e.message)}}}
  need.forEach(function(o){if(!o.cat)o.cat='Прочее'});
  add.forEach(function(o){touch(o);S.ops.push(o)});save();
  var dates=add.map(function(o){return o.date.slice(0,7)}).sort();if(dates.length){UI.mm=dates[dates.length-1]}
  UI.busy='';toast('Добавлено операций: '+add.length+(dup?', дубликатов пропущено: '+dup:''));

 case 'mxv':UI.mx=b.dataset.k;render();break;
 case 'dirf':UI.dir=b.dataset.k;render();break;
 case 'remind':{var t2=S.tasks.find(function(x){return x.id===id});if(!t2)break;var txt=t2.assignee+', напоминаю про задачу: «'+t2.t+'»'+(t2.due?', срок '+dlabel(t2.due):'')+'. Как продвигается?';
  if(navigator.share){navigator.share({text:txt}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(txt);toast('Текст напоминания скопирован')}break}
 case 'to':S.set.to.cur=Math.max(0,S.set.to.cur+(+b.dataset.d));touch(S.set);save();render();break;
 case 'sync':sync(false);break;
 case 'vk':makeKeys().catch(function(e){toast('Не удалось создать ключи: '+e.message)});break;
 case 'pe':enablePush();break;
 case 'pt':testPush();break;
 case 'cp':{var ta=$('#vpriv');if(ta){ta.select();try{navigator.clipboard.writeText(ta.value);toast('Скопировано')}catch(e){document.execCommand('copy');toast('Скопировано')}}break}
 case 'theme':S.set.theme=S.set.theme==='dk'?'lt':'dk';touch(S.set);save();applyTheme();render();break;
 case 'exp':{var blob=new Blob([JSON.stringify({v:1,tasks:S.tasks,rec:S.rec,ops:S.ops,rules:S.rules,set:S.set},null,1)],{type:'application/json'});var u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='planner-'+today()+'.json';l.click();setTimeout(function(){URL.revokeObjectURL(u)},2000);break}
 case 'imp':$('#impf').click();break;
 case 'mm':{var y=+UI.mm.slice(0,4),m=+UI.mm.slice(5,7)-1+(+b.dataset.d),dd=new Date(y,m,1);UI.mm=dd.getFullYear()+'-'+pad(dd.getMonth()+1);render();break}
 case 'me':UI.me=b.dataset.k;render();break;
 case 'up':uploadSheet();break;
 case 'doup':doUpload();break;
 case 'ao':opSheet();break;
 case 'eo':opSheet(id);break;
 case 'so':saveOp();break;
 case 'do':{var o=S.ops.find(function(x){return x.id===id});if(o&&confirm('Удалить операцию?')){o.del=true;touch(o);save();closeSheet();render()}break}
 case 'ci':confirmSheet();break;
 case 'ciset':{var o2=S.ops.find(function(x){return x.id===id});if(o2){o2.kind=b.dataset.v;if(o2.kind==='inc')o2.cat='Доход, между организациями';if(o2.kind==='exp')o2.cat='Между организациями';touch(o2);save();confirmSheet()}break}
 }});
document.addEventListener('change',function(e){var t=e.target;
 if(t.dataset&&t.dataset.pi!=null){UI.prop[+t.dataset.pi].on=t.checked;return}
 if(t.id==='sm'){S.set.syncMoney=t.checked;touch(S.set);save();return}
 if(t.id==='impf'){var f=t.files[0];if(!f)return;f.text().then(function(x){try{var j=JSON.parse(x);if(!confirm('Объединить данные из файла с текущими?'))return;S=mergeState(Object.assign(S,{}),Object.assign({ops:[],rules:[]},j));S.set.syncMoney=S.set.syncMoney||false;S.ops=mergeList(S.ops,j.ops||[]);S.rules=mergeList(S.rules,j.rules||[]);save();applyTheme();render();toast('Импортировано')}catch(err){toast('Файл не похож на экспорт планировщика')}});return}
 var p=t.dataset&&t.dataset.set;if(!p)return;var v=t.type==='number'?(+t.value):t.value;
 if(p[0]==='$'){SEC[p.slice(1)]=v;saveSec();return}
 var a=p.split('.'),o=S.set;for(var i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v;touch(S.set);save()});
document.addEventListener('keydown',function(e){if(e.target.id==='qa'&&e.key==='Enter'){var v=e.target.value.trim();if(!v)return;S.tasks.push(newTask(guess(v)));save();e.target.value='';render();toast('Задача добавлена');setTimeout(function(){var q=$('#qa');if(q)q.focus()},50)}});
document.addEventListener('input',function(e){if(e.target.id==='inb')UI.inbox=e.target.value});
$('#sheet').addEventListener('click',function(e){if(e.target.id==='sheet')closeSheet()});

/* ---------- swipe ---------- */
function swipe(kind,id,dir){
 if(kind==='t'){var t=S.tasks.find(function(x){return x.id===id});if(!t){render();return}
  if(dir==='r'){toggleTask(id);return}
  t.due=addDays(t.due&&t.due>today()?t.due:today(),1);touch(t);save();render();toast('Перенесено: '+dlabel(t.due));return}
 if(kind==='r'){var r=S.rec.find(function(x){return x.id===id});if(!r||dir!=='r'){render();return}
  r.log=r.log||{};var d=today();if(r.log[d])delete r.log[d];else r.log[d]=1;touch(r);save();render()}}
(function(){var sx=0,sy=0,el=null,dx=0,act=false;
 document.addEventListener('touchstart',function(e){var c=e.target.closest('.card[data-sw]');if(!c||e.touches.length!==1){el=null;return}el=c;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;act=false;c.style.transition='none'},{passive:true});
 document.addEventListener('touchmove',function(e){if(!el)return;var x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
  if(!act){if(Math.abs(x)>10&&Math.abs(x)>Math.abs(y)*1.5)act=true;else if(Math.abs(y)>10){el.style.transition='';el=null;return}}
  if(act){dx=x;el.style.transform='translateX('+x+'px)'}},{passive:true});
 document.addEventListener('touchend',function(){if(!el)return;var c=el;el=null;c.style.transition='transform .2s';
  if(act&&Math.abs(dx)>90){var k=c.dataset.sw,id=c.dataset.id,dir=dx>0?'r':'l';c.style.transform='translateX('+(dx>0?'110%':'-110%')+')';setTimeout(function(){swipe(k,id,dir)},170)}else{c.style.transform=''}act=false});
 document.addEventListener('touchcancel',function(){if(el){el.style.transform='';el=null}});
})();

load();applyTheme();render();
if(SEC.gh&&SEC.repo)sync(true);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
